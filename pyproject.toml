[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missingness-auditor"
version = "0.3.0"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "scikit-learn>=1.1.0",
    "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
